[package]
name = "nRF52840"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-probe = { version = "0.3", features = ["print-defmt"] }
defmt = "0.3"
defmt-rtt = "0.4"

embassy-nrf = { version = "0.8", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = "0.5"

embedded-graphics = "0.7.1"
embedded-hal = "0.2.7"
nb = "1.0"
sharp-memory-display = { version = "0.3", default-features = false, features = ["ls027b7dh01"] }

panic-halt = "1.0"

[profile.release]
debug = 2
lto = true
opt-level = "s"
